name: akonmedia

x-app: &app
  build:
    context: .
  image: akonmedia:local
  restart: unless-stopped
  # Defaults first, then your own .env (copied from .env.docker and edited),
  # whose values win. A missing .env is fine for a first local run.
  env_file:
    - .env.docker
    - path: .env
      required: false
  volumes:
    - media:/app/media
    # The ingest server's recordings, joined into a video when a live ends.
    - live:/app/live
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: akonmedia
      POSTGRES_USER: akonmedia
      POSTGRES_PASSWORD: akonmedia
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akonmedia -d akonmedia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=2
    environment:
      RUN_MIGRATIONS: "0"
    # The HTTP health check in the image is for the web process only.
    healthcheck:
      disable: true

  live:
    # nginx with the RTMP module: encoders publish here, viewers watch the HLS.
    build:
      context: docker/live
    image: akonmedia-live:local
    restart: unless-stopped
    env_file:
      - .env.docker
      - path: .env
        required: false
    ports:
      - "1935:1935"   # RTMP from OBS and other encoders
      - "8080:8080"   # HLS for viewers; put it behind your HTTPS proxy in production
    volumes:
      - live:/var/lib/akon-live
    depends_on:
      - web

  beat:
    <<: *app
    # Runs the hourly purge of abandoned uploads (CELERY_BEAT_SCHEDULE).
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      RUN_MIGRATIONS: "0"
    healthcheck:
      disable: true

volumes:
  postgres:
  media:
  live:
