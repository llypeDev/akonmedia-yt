{% load static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ PORTAL_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'core:index' %}">{% include "core/_brand.html" %}</a>

    <form class="search" action="{% url 'core:search' %}" method="get" role="search">
      <input type="search" name="q" placeholder="Search media" value="{{ request.GET.q|default:'' }}"
             aria-label="Search media">
    </form>

    <nav class="site-nav">
      {% if user.is_authenticated %}
        <a href="/admin/">{{ user.get_short_name }}</a>
        <form action="{% url 'account_logout' %}" method="post" class="inline">
          {% csrf_token %}
          <button type="submit" class="link">Sign out</button>
        </form>
      {% else %}
        <a href="{% url 'account_login' %}">Sign in</a>
        <a class="button" href="{% url 'account_signup' %}">Join</a>
      {% endif %}
    </nav>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>{{ PORTAL_NAME }}</span>
  </footer>
</body>
</html>
