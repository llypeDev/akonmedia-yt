<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ PORTAL_NAME }}{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0b0d10;
      color: #e8eaed;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; border-bottom: 1px solid #1e2228;
    }
    header a { color: inherit; text-decoration: none; }
    .brand { font-weight: 700; letter-spacing: -0.02em; }
    .brand span { color: #2fbf71; }
    nav a { margin-left: 1.25rem; color: #9aa4b2; font-size: 0.9375rem; }
    nav a:hover { color: #e8eaed; }
    main { max-width: 46rem; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-size: 2.25rem; line-height: 1.15; letter-spacing: -0.03em; margin: 0 0 1rem; }
    p.lede { color: #9aa4b2; font-size: 1.125rem; margin: 0 0 2rem; }
    code { background: #14181d; padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
    .badge { display: inline-block; font-size: 0.75rem; letter-spacing: 0.08em;
             text-transform: uppercase; color: #2fbf71; border: 1px solid #1f4d36;
             border-radius: 999px; padding: 0.2rem 0.6rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">{{ PORTAL_NAME|slice:":4" }}<span>{{ PORTAL_NAME|slice:"4:" }}</span></a>
    <nav>
      {% if user.is_authenticated %}
        <a href="/api/v1/whoami/">Account</a>
        <a href="/admin/">Admin</a>
      {% else %}
        <a href="{% url 'account_login' %}">Sign in</a>
        <a href="{% url 'account_signup' %}">Create account</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
